<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会社一覧ダッシュボード</title>
<style>
  :root {
    --bg: #0e1420;
    --card: #171f2e;
    --card2: #1d2739;
    --line: #2a3549;
    --text: #ffffff;
    --muted: #c3cede;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --ok: #33c48d;
    --warn: #ffb020;
    --danger: #ff5c6c;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #43577d rgba(255,255,255,.05); }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 999px; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #43577d, #2b3852);
    border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #6aa2ff, #8a6bff); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1b2740 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 18px 60px; }
  header.top { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.35); flex-wrap: wrap; }
  header.top .brand { display: flex; flex-direction: column; gap: 2px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
  header.top .sub { color: var(--muted); font-size: 13px; }
  .nav-link {
    margin-left: auto; font-size: 13px; font-weight: 700; color: var(--text); text-decoration: none;
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
    transition: border-color .15s, background .15s;
  }
  .nav-link:hover { border-color: var(--accent); background: #22304a; }

  .banner { border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .banner.show { display: block; }
  .banner.err { background: rgba(255,92,108,.12); border: 1px solid rgba(255,92,108,.4); color: #ffb3bb; }

  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(51,196,141,.5);} 70%{box-shadow:0 0 0 8px rgba(51,196,141,0);} 100%{box-shadow:0 0 0 0 rgba(51,196,141,0);} }

  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    flex: 1 1 0; min-width: 140px; background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .stat .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.count .v { color: var(--accent); }
  .stat.emp .v { color: var(--ok); }
  .stat.shop .v { color: var(--warn); }
  .stat.money .v { color: var(--accent2); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input, .toolbar select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none;
  }
  .toolbar input { flex: 1 1 220px; min-width: 180px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

  .co-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .co-card {
    background: linear-gradient(180deg, var(--card) 0%, #141b28 100%);
    border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px;
  }
  .co-head { display: flex; align-items: center; gap: 12px; }
  .co-ava { width: 48px; height: 48px; border-radius: 10px; flex: 0 0 auto; image-rendering: pixelated; background: #0f1623; object-fit: cover; border: 1px solid var(--line); }
  .co-title { min-width: 0; }
  .co-name { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .co-owner { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .co-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .co-stat { flex: 1 1 0; min-width: 90px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .co-stat .k { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .co-stat .v { font-size: 20px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .co-stat.money .v { color: var(--accent2); font-size: 17px; }
  .co-stat.money .v small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  .co-emp-title { font-size: 11px; color: var(--muted); letter-spacing: .05em; margin-bottom: 7px; }
  .co-emps { display: flex; flex-wrap: wrap; gap: 6px; }
  .emp {
    display: inline-flex; align-items: center; gap: 6px; background: #0f1623; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12px; max-width: 100%;
  }
  .emp img { width: 20px; height: 20px; border-radius: 50%; image-rendering: pixelated; background: #0f1623; flex: 0 0 auto; }
  .emp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .loading { color: var(--muted); opacity: .75; animation: loadpulse 1.4s ease-in-out infinite; }
  @keyframes loadpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>マタク鯖 会社一覧</h1>
      <span class="sub">会社情報 / 社長・従業員・ショップ・所持金</span>
    </div>
    <a class="nav-link" href="./index.html">議席ダッシュボード</a>
    <span class="live" id="live"><span class="pulse"></span>読み込み中...</span>
  </header>

  <div id="error" class="banner err"></div>

  <div class="summary" id="summary" hidden>
    <div class="stat count"><div class="k">会社数</div><div class="v" id="sum-count">&hellip;</div></div>
    <div class="stat emp"><div class="k">従業員合計</div><div class="v" id="sum-emp">&hellip;</div></div>
    <div class="stat shop"><div class="k">ショップ合計</div><div class="v" id="sum-shop">&hellip;</div></div>
    <div class="stat money"><div class="k">所持金合計</div><div class="v" id="sum-money">&hellip;</div></div>
  </div>

  <div class="toolbar" id="toolbar" hidden>
    <input type="text" id="search" placeholder="会社名・社長・従業員で検索...">
    <select id="sort">
      <option value="balance">所持金が多い順</option>
      <option value="shops">ショップ数が多い順</option>
      <option value="employees">従業員が多い順</option>
      <option value="name">名前順</option>
    </select>
  </div>

  <div class="co-grid" id="grid"><div class="empty loading">読み込み中...</div></div>
</div>

<script>
(function () {
  "use strict";

  var COMPANY_URLS = [
    "./company.json",
    "http://n3.host.ringonw.com:3315/company.json",
    "https://r.jina.ai/http://n3.host.ringonw.com:3315/company.json"
  ];

  var state = { companies: [], sort: "balance", query: "" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    return n.toLocaleString("ja-JP", { maximumFractionDigits: 2 });
  }

  function avatar(key) {
    return "https://mc-heads.net/avatar/" + encodeURIComponent(key || "MHF_Question") + "/64";
  }

  function parseJsonLoose(text) {
    if (text == null) throw new Error("empty response");
    var s = String(text).trim();
    try { return JSON.parse(s); } catch (e) { /* fall through */ }
    var a = s.indexOf("{");
    var b = s.lastIndexOf("}");
    if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
    throw new Error("invalid json");
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) { return parseJsonLoose(text); });
  }

  function applyData(data) {
    data = data || {};
    state.companies = (data.companies || []).map(function (c) {
      var employees = (c && c.employees) || [];
      var shops = (c && c.shops) || [];
      return {
        name: (c && c.name) ? String(c.name) : "名称未設定",
        owner: (c && c.owner) ? String(c.owner) : "",
        ownerUuid: (c && c.ownerUuid) || "",
        balance: Number(c && c.balance) || 0,
        employees: employees,
        employeeCount: (c && c.employeeCount) | 0 || employees.length,
        shops: shops,
        shopCount: shops.length
      };
    });
  }

  function filtered() {
    var q = state.query.trim().toLowerCase();
    var list = state.companies.filter(function (c) {
      if (!q) return true;
      var hay = (c.name + " " + c.owner + " " + c.employees.join(" ")).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    var s = state.sort;
    list.sort(function (a, b) {
      if (s === "shops") return b.shopCount - a.shopCount;
      if (s === "employees") return b.employeeCount - a.employeeCount;
      if (s === "name") return a.name.localeCompare(b.name, "ja");
      return b.balance - a.balance;
    });
    return list;
  }

  function empChip(name) {
    return '<span class="emp"><img src="' + esc(avatar(name)) + '" alt="" loading="lazy" ' +
           'onerror="this.style.visibility=\'hidden\'"><span>' + esc(name) + '</span></span>';
  }

  function card(c) {
    var key = c.ownerUuid || c.owner || c.name;
    var emps = c.employees.length
      ? c.employees.map(function (e) { return empChip(e); }).join("")
      : '<span class="co-emp-title" style="margin:0">従業員なし</span>';
    return '' +
      '<div class="co-card">' +
        '<div class="co-head">' +
          '<img class="co-ava" src="' + esc(avatar(key)) + '" alt="" loading="lazy" ' +
            'onerror="this.style.visibility=\'hidden\'">' +
          '<div class="co-title">' +
            '<div class="co-name">' + esc(c.name) + '</div>' +
            '<div class="co-owner">社長: ' + esc(c.owner || "-") + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="co-stats">' +
          '<div class="co-stat"><div class="k">従業員</div><div class="v">' + c.employeeCount + '<small style="font-size:11px;color:var(--muted);font-weight:500;">名</small></div></div>' +
          '<div class="co-stat"><div class="k">ショップ数</div><div class="v">' + c.shopCount + '<small style="font-size:11px;color:var(--muted);font-weight:500;">件</small></div></div>' +
          '<div class="co-stat money"><div class="k">所持金</div><div class="v">' + fmtMoney(c.balance) + '<small>G</small></div></div>' +
        '</div>' +
        '<div>' +
          '<div class="co-emp-title">従業員一覧</div>' +
          '<div class="co-emps">' + emps + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderSummary(list) {
    var emp = 0, shop = 0, money = 0;
    list.forEach(function (c) { emp += c.employeeCount; shop += c.shopCount; money += c.balance; });
    document.getElementById("sum-count").textContent = list.length;
    document.getElementById("sum-emp").textContent = emp;
    document.getElementById("sum-shop").textContent = shop;
    document.getElementById("sum-money").textContent = fmtMoney(money);
    document.getElementById("summary").hidden = false;
  }

  function render() {
    var list = filtered();
    renderSummary(list);
    var grid = document.getElementById("grid");
    if (!list.length) {
      grid.innerHTML = '<div class="empty">該当する会社がありません。</div>';
      return;
    }
    grid.innerHTML = list.map(card).join("");
  }

  function showError(message) {
    var e = document.getElementById("error");
    e.textContent = message;
    e.className = "banner show err";
    document.getElementById("live").innerHTML = '<span class="pulse" style="background:var(--danger)"></span>読み込み失敗';
    document.getElementById("grid").innerHTML = '<div class="empty">会社情報を表示できませんでした。</div>';
  }

  function setupToolbar() {
    document.getElementById("search").addEventListener("input", function () {
      state.query = this.value;
      render();
    });
    document.getElementById("sort").addEventListener("change", function () {
      state.sort = this.value;
      render();
    });
  }

  function load() {
    var i = 0;
    function attempt() {
      if (i >= COMPANY_URLS.length) {
        showError("company.json の読み込みに失敗しました。");
        return;
      }
      fetchJson(COMPANY_URLS[i++])
        .then(function (data) {
          applyData(data);
          document.getElementById("error").className = "banner";
          document.getElementById("live").innerHTML = '<span class="pulse"></span>最終更新 ' +
            new Date().toLocaleTimeString("ja-JP");
          document.getElementById("toolbar").hidden = false;
          render();
        })
        .catch(function () { attempt(); });
    }
    attempt();
  }

  setupToolbar();
  load();
})();
</script>
</body>
</html>
