<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会社一覧ダッシュボード</title>
<style>
  :root {
    --bg: #0e1420;
    --card: #171f2e;
    --card2: #1d2739;
    --line: #2a3549;
    --text: #ffffff;
    --muted: #c3cede;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --ok: #33c48d;
    --warn: #ffb020;
    --danger: #ff5c6c;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #43577d rgba(255,255,255,.05); }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 999px; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #43577d, #2b3852);
    border: 3px solid transparent; border-radius: 999px; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #6aa2ff, #8a6bff); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1b2740 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 18px 60px; }
  header.top { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.35); flex-wrap: wrap; }
  header.top .brand { display: flex; flex-direction: column; gap: 2px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
  header.top .sub { color: var(--muted); font-size: 13px; }
  .nav-link {
    margin-left: auto; font-size: 13px; font-weight: 700; color: var(--text); text-decoration: none;
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
    transition: border-color .15s, background .15s;
  }
  .nav-link:hover { border-color: var(--accent); background: #22304a; }

  .banner { border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .banner.show { display: block; }
  .banner.err { background: rgba(255,92,108,.12); border: 1px solid rgba(255,92,108,.4); color: #ffb3bb; }

  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(51,196,141,.5);} 70%{box-shadow:0 0 0 8px rgba(51,196,141,0);} 100%{box-shadow:0 0 0 0 rgba(51,196,141,0);} }

  .hero {
    background:
      radial-gradient(600px 200px at 50% -40%, rgba(124,92,255,.25) 0%, rgba(124,92,255,0) 70%),
      linear-gradient(135deg, #1b2740 0%, var(--card) 55%, var(--card2) 100%);
    border: 1px solid var(--line); border-radius: 18px; padding: 24px 24px 20px;
    margin-bottom: 20px; text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,.35);
  }
  .hero-label { font-size: 13px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
  .hero-value {
    font-size: 68px; font-weight: 900; line-height: 1.02; margin-top: 6px; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #6aa2ff 0%, #8a6bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-value small {
    font-size: 22px; font-weight: 600; margin-left: 6px; color: var(--muted);
    -webkit-text-fill-color: var(--muted);
  }
  .hero-sub {
    margin-top: 10px; display: flex; justify-content: center; align-items: center;
    gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted);
  }
  .hero-sub .st-chg { font-size: 15px; }
  .hero-chart { margin-top: 16px; }
  .hero-svg {
    width: 100%; height: 200px; display: block; background: #0f1623;
    border: 1px solid var(--line); border-radius: 12px;
  }
  .hero-meta {
    margin-top: 8px; display: flex; justify-content: center; align-items: center;
    gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  }
  .hero-meta b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
  .hero-legend { font-size: 12px; color: var(--muted); padding: 14px 0; }
  @media (max-width: 560px) {
    .hero-value { font-size: 46px; } .hero-value small { font-size: 16px; }
    .hero-svg { height: 150px; }
  }

  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    flex: 1 1 0; min-width: 140px; background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .stat .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.count .v { color: var(--accent); }
  .stat.emp .v { color: var(--ok); }
  .stat.shop .v { color: var(--warn); }
  .stat.money .v { color: var(--accent2); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input, .toolbar select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; outline: none;
  }
  .toolbar input { flex: 1 1 220px; min-width: 180px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

  .co-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .co-card {
    background: linear-gradient(180deg, var(--card) 0%, #141b28 100%);
    border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px;
  }
  .co-head { display: flex; align-items: center; gap: 12px; }
  .co-ava { width: 48px; height: 48px; border-radius: 10px; flex: 0 0 auto; image-rendering: pixelated; background: #0f1623; object-fit: cover; border: 1px solid var(--line); }
  .co-title { min-width: 0; }
  .co-name { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .co-owner { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .co-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .co-stat { flex: 1 1 0; min-width: 90px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .co-stat .k { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .co-stat .v { font-size: 20px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .co-stat.money .v { color: var(--accent2); font-size: 17px; }
  .co-stat.money .v small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  .co-emp-title { font-size: 11px; color: var(--muted); letter-spacing: .05em; margin-bottom: 7px; }
  .co-emps { display: flex; flex-wrap: wrap; gap: 6px; }
  .emp {
    display: inline-flex; align-items: center; gap: 6px; background: #0f1623; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12px; max-width: 100%;
  }
  .emp img { width: 20px; height: 20px; border-radius: 50%; image-rendering: pixelated; background: #0f1623; flex: 0 0 auto; }
  .emp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .co-stock { border-top: 1px solid var(--line); padding-top: 10px; }
  .co-stock > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    user-select: none; outline: none; padding: 2px 0;
  }
  .co-stock > summary::-webkit-details-marker { display: none; }
  .co-stock > summary:hover .st-title { color: var(--accent); }
  .st-title { font-weight: 700; font-size: 12px; letter-spacing: .05em; color: var(--text); transition: color .15s; }
  .st-price { margin-left: auto; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
  .st-price small { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .st-chg { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
  .st-chg.up { color: var(--ok); }
  .st-chg.down { color: var(--danger); }
  .st-caret { color: var(--muted); font-size: 11px; transition: transform .18s ease; }
  .co-stock[open] .st-caret { transform: rotate(180deg); }
  .stock-chart { margin-top: 10px; }
  .stock-svg {
    width: 100%; height: 96px; display: block; background: #0f1623;
    border: 1px solid var(--line); border-radius: 10px;
  }
  .stock-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 7px; }
  .stock-meta b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 700; }
  .stock-meta b.up { color: var(--ok); }
  .stock-meta b.down { color: var(--danger); }
  .stock-empty { font-size: 12px; color: var(--muted); padding: 10px 0; }

  .loading { color: var(--muted); opacity: .75; animation: loadpulse 1.4s ease-in-out infinite; }
  @keyframes loadpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>マタク鯖 会社一覧</h1>
      <span class="sub">会社情報 / 社長・従業員・ショップ・所持金・株価</span>
    </div>
    <a class="nav-link" href="../index.html">議席ダッシュボード</a>
    <span class="live" id="live"><span class="pulse"></span>読み込み中...</span>
  </header>

  <div class="hero" id="hero" hidden>
    <div class="hero-label">サーバー平均株価</div>
    <div class="hero-value"><span id="hero-price">&hellip;</span><small>G</small></div>
    <div class="hero-sub">
      <span class="st-chg" id="hero-chg">&mdash;</span>
      <span id="hero-count">対象 0社</span>
    </div>
    <div class="hero-chart" id="hero-chart"></div>
  </div>

  <div id="error" class="banner err"></div>

  <div class="summary" id="summary" hidden>
    <div class="stat count"><div class="k">会社数</div><div class="v" id="sum-count">&hellip;</div></div>
    <div class="stat emp"><div class="k">従業員合計</div><div class="v" id="sum-emp">&hellip;</div></div>
    <div class="stat shop"><div class="k">ショップ合計</div><div class="v" id="sum-shop">&hellip;</div></div>
    <div class="stat money"><div class="k">所持金合計</div><div class="v" id="sum-money">&hellip;</div></div>
  </div>

  <div class="toolbar" id="toolbar" hidden>
    <input type="text" id="search" placeholder="会社名・社長・従業員で検索...">
    <select id="sort">
      <option value="balance">所持金が多い順</option>
      <option value="shops">ショップ数が多い順</option>
      <option value="employees">従業員が多い順</option>
      <option value="name">名前順</option>
    </select>
  </div>

  <div class="co-grid" id="grid"><div class="empty loading">読み込み中...</div></div>
</div>

<script>
(function () {
  "use strict";

  var COMPANY_URLS = [
    "../company.json",
    "./company.json",
    "http://n3.host.ringonw.com:3315/company.json",
    "https://r.jina.ai/http://n3.host.ringonw.com:3315/company.json"
  ];

  var state = { companies: [], sort: "balance", query: "" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    return n.toLocaleString("ja-JP", { maximumFractionDigits: 2 });
  }

  function avatar(key) {
    return "https://mc-heads.net/avatar/" + encodeURIComponent(key || "MHF_Question") + "/64";
  }

  function parseJsonLoose(text) {
    if (text == null) throw new Error("empty response");
    var s = String(text).trim();
    try { return JSON.parse(s); } catch (e) { /* fall through */ }
    var a = s.indexOf("{");
    var b = s.lastIndexOf("}");
    if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
    throw new Error("invalid json");
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) { return parseJsonLoose(text); });
  }

  function applyData(data) {
    data = data || {};
    state.companies = (data.companies || []).map(function (c) {
      var employees = (c && c.employees) || [];
      var shops = (c && c.shops) || [];
      return {
        name: (c && c.name) ? String(c.name) : "名称未設定",
        owner: (c && c.owner) ? String(c.owner) : "",
        ownerUuid: (c && c.ownerUuid) || "",
        balance: Number(c && c.balance) || 0,
        employees: employees,
        employeeCount: (c && c.employeeCount) | 0 || employees.length,
        shops: shops,
        shopCount: shops.length,
        stock: (c && c.stock) || null
      };
    });
  }

  function filtered() {
    var q = state.query.trim().toLowerCase();
    var list = state.companies.filter(function (c) {
      if (!q) return true;
      var hay = (c.name + " " + c.owner + " " + c.employees.join(" ")).toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    var s = state.sort;
    list.sort(function (a, b) {
      if (s === "shops") return b.shopCount - a.shopCount;
      if (s === "employees") return b.employeeCount - a.employeeCount;
      if (s === "name") return a.name.localeCompare(b.name, "ja");
      return b.balance - a.balance;
    });
    return list;
  }

  function empChip(name) {
    return '<span class="emp"><img src="' + esc(avatar(name)) + '" alt="" loading="lazy" ' +
           'onerror="this.style.visibility=\'hidden\'"><span>' + esc(name) + '</span></span>';
  }

  function stockInfo(stock) {
    stock = stock || {};
    var hist = (stock.history || []).filter(function (p) {
      return p && typeof p.price === "number" && isFinite(p.price);
    }).sort(function (a, b) { return (a.time || 0) - (b.time || 0); });
    var values = hist.map(function (p) { return p.price; });
    if (!values.length && typeof stock.price === "number" && isFinite(stock.price)) {
      values = [stock.price];
    }
    var price = (typeof stock.price === "number" && isFinite(stock.price))
      ? stock.price : (values.length ? values[values.length - 1] : 0);
    var first = values.length ? values[0] : price;
    var last = values.length ? values[values.length - 1] : price;
    var chg = first ? (last - first) / first * 100 : 0;
    var lastTime = hist.length ? hist[hist.length - 1].time : 0;
    return { values: values, price: price, first: first, last: last, min: values.length ? Math.min.apply(null, values) : price, max: values.length ? Math.max.apply(null, values) : price, chg: chg, up: last >= first, time: lastTime };
  }

  function stockChart(stock) {
    var s = stockInfo(stock);
    var values = s.values;
    if (!values.length) return '<div class="stock-empty">株価データがありません。</div>';

    var W = 320, H = 96, padX = 10, padY = 12;
    var min = s.min, max = s.max;
    if (min === max) { min -= 1; max += 1; }
    var n = values.length;
    function X(i) { return padX + (n > 1 ? i * (W - 2 * padX) / (n - 1) : (W - 2 * padX) / 2); }
    function Y(v) { return padY + (1 - (v - min) / (max - min)) * (H - 2 * padY); }

    var line = "", i;
    for (i = 0; i < n; i++) {
      line += (i ? " L " : "M ") + X(i).toFixed(2) + " " + Y(values[i]).toFixed(2);
    }
    var area = line + " L " + X(n - 1).toFixed(2) + " " + (H - padY) +
               " L " + X(0).toFixed(2) + " " + (H - padY) + " Z";

    var color = s.up ? "#33c48d" : "#ff5c6c";
    var chgTxt = (s.chg >= 0 ? "+" : "") + s.chg.toFixed(2) + "%";

    var svg = '<svg class="stock-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="株価チャート">' +
      '<path d="' + area + '" fill="' + color + '" fill-opacity="0.14"/>' +
      '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '</svg>';

    return '<div class="stock-chart">' + svg +
      '<div class="stock-meta">' +
        '<span>最高 <b>' + fmtMoney(s.max) + '</b></span>' +
        '<span>最低 <b>' + fmtMoney(s.min) + '</b></span>' +
        '<span>騰落 <b class="' + (s.up ? "up" : "down") + '">' + chgTxt + '</b></span>' +
      '</div>' +
      '</div>';
  }

  function card(c) {
    var key = c.ownerUuid || c.owner || c.name;
    var emps = c.employees.length
      ? c.employees.map(function (e) { return empChip(e); }).join("")
      : '<span class="co-emp-title" style="margin:0">従業員なし</span>';
    return '' +
      '<div class="co-card">' +
        '<div class="co-head">' +
          '<img class="co-ava" src="' + esc(avatar(key)) + '" alt="" loading="lazy" ' +
            'onerror="this.style.visibility=\'hidden\'">' +
          '<div class="co-title">' +
            '<div class="co-name">' + esc(c.name) + '</div>' +
            '<div class="co-owner">社長: ' + esc(c.owner || "-") + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="co-stats">' +
          '<div class="co-stat"><div class="k">従業員</div><div class="v">' + c.employeeCount + '<small style="font-size:11px;color:var(--muted);font-weight:500;">名</small></div></div>' +
          '<div class="co-stat"><div class="k">ショップ数</div><div class="v">' + c.shopCount + '<small style="font-size:11px;color:var(--muted);font-weight:500;">件</small></div></div>' +
          '<div class="co-stat money"><div class="k">所持金</div><div class="v">' + fmtMoney(c.balance) + '<small>G</small></div></div>' +
        '</div>' +
        '<div>' +
          '<div class="co-emp-title">従業員一覧</div>' +
          '<div class="co-emps">' + emps + '</div>' +
        '</div>' +
        stockBlock(c) +
      '</div>';
  }

  function stockBlock(c) {
    var s = stockInfo(c.stock);
    var chgTxt = (s.chg >= 0 ? "+" : "") + s.chg.toFixed(2) + "%";
    return '<details class="co-stock">' +
      '<summary>' +
        '<span class="st-title">株価チャート</span>' +
        '<span class="st-price">' + fmtMoney(s.price) + '<small>G</small></span>' +
        '<span class="st-chg ' + (s.up ? "up" : "down") + '">' + chgTxt + '</span>' +
        '<span class="st-caret" aria-hidden="true">▾</span>' +
      '</summary>' +
      stockChart(c.stock) +
      '</details>';
  }

  function renderSummary(list) {
    var emp = 0, shop = 0, money = 0;
    list.forEach(function (c) { emp += c.employeeCount; shop += c.shopCount; money += c.balance; });
    document.getElementById("sum-count").textContent = list.length;
    document.getElementById("sum-emp").textContent = emp;
    document.getElementById("sum-shop").textContent = shop;
    document.getElementById("sum-money").textContent = fmtMoney(money);
    document.getElementById("summary").hidden = false;
  }

  function avgSeries() {
    var hist = [];
    state.companies.forEach(function (c) {
      var h = ((c.stock && c.stock.history) || []).filter(function (p) {
        return p && typeof p.price === "number" && isFinite(p.price);
      }).splice(0).sort(function (a, b) { return (a.time || 0) - (b.time || 0); });
      if (h.length) hist.push(h);
    });
    if (!hist.length) return [];

    var seen = {};
    hist.forEach(function (h) {
      h.forEach(function (p) { seen[Number(p.time) || 0] = true; });
    });
    var timeline = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });

    var series = [];
    timeline.forEach(function (t) {
      var sum = 0, cnt = 0;
      hist.forEach(function (h) {
        var last = null;
        for (var i = 0; i < h.length; i++) {
          if ((Number(h[i].time) || 0) <= t) last = h[i].price; else break;
        }
        if (last != null) { sum += last; cnt++; }
      });
      if (cnt) series.push({ time: t, price: sum / cnt });
    });
    return series;
  }

  function renderHeroChart() {
    var el = document.getElementById("hero-chart");
    var series = avgSeries();
    if (series.length < 2) {
      el.innerHTML = '<div class="hero-legend">平均株価チャートのデータがありません。</div>';
      return;
    }
    var maxPts = 240;
    if (series.length > maxPts) series = series.slice(series.length - maxPts);

    var values = series.map(function (p) { return p.price; });
    var W = 1000, H = 200, padX = 8, padY = 16;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var n = values.length;
    function X(i) { return padX + i * (W - 2 * padX) / (n - 1); }
    function Y(v) { return padY + (1 - (v - min) / (max - min)) * (H - 2 * padY); }

    var line = "", i;
    for (i = 0; i < n; i++) {
      line += (i ? " L " : "M ") + X(i).toFixed(2) + " " + Y(values[i]).toFixed(2);
    }
    var area = line + " L " + X(n - 1).toFixed(2) + " " + (H - padY) +
               " L " + X(0).toFixed(2) + " " + (H - padY) + " Z";

    var up = values[n - 1] >= values[0];
    var color = up ? "#33c48d" : "#ff5c6c";

    el.innerHTML =
      '<svg class="hero-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="サーバー平均株価チャート">' +
        '<defs><linearGradient id="heroFill" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/>' +
          '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#heroFill)"/>' +
        '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2.5" ' +
          'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '</svg>' +
      '<div class="hero-meta">' +
        '<span>最高 <b>' + fmtMoney(max) + '</b> G</span>' +
        '<span>最低 <b>' + fmtMoney(min) + '</b> G</span>' +
        '<span>' + n + ' 点</span>' +
      '</div>';
  }

  function renderHero() {
    var prices = [], chgs = [];
    state.companies.forEach(function (c) {
      var s = stockInfo(c.stock);
      if (s.price > 0) {
        prices.push(s.price);
        if (s.values.length > 1) chgs.push(s.chg);
      }
    });
    var hero = document.getElementById("hero");
    if (!prices.length) { hero.hidden = true; document.getElementById("hero-chart").innerHTML = ""; return; }
    var avg = prices.reduce(function (a, b) { return a + b; }, 0) / prices.length;
    document.getElementById("hero-price").textContent = fmtMoney(avg);
    var chgEl = document.getElementById("hero-chg");
    if (chgs.length) {
      var avgChg = chgs.reduce(function (a, b) { return a + b; }, 0) / chgs.length;
      chgEl.textContent = (avgChg >= 0 ? "+" : "") + avgChg.toFixed(2) + "%";
      chgEl.className = "st-chg " + (avgChg >= 0 ? "up" : "down");
    } else {
      chgEl.textContent = "\u2014";
      chgEl.className = "st-chg";
    }
    document.getElementById("hero-count").textContent = "対象 " + prices.length + "社";
    renderHeroChart();
    hero.hidden = false;
  }

  function render() {
    var list = filtered();
    renderHero();
    renderSummary(list);
    var grid = document.getElementById("grid");
    if (!list.length) {
      grid.innerHTML = '<div class="empty">該当する会社がありません。</div>';
      return;
    }
    grid.innerHTML = list.map(card).join("");
  }

  function showError(message) {
    var e = document.getElementById("error");
    e.textContent = message;
    e.className = "banner show err";
    document.getElementById("live").innerHTML = '<span class="pulse" style="background:var(--danger)"></span>読み込み失敗';
    document.getElementById("grid").innerHTML = '<div class="empty">会社情報を表示できませんでした。</div>';
  }

  function setupToolbar() {
    document.getElementById("search").addEventListener("input", function () {
      state.query = this.value;
      render();
    });
    document.getElementById("sort").addEventListener("change", function () {
      state.sort = this.value;
      render();
    });
  }

  function load() {
    var i = 0;
    function attempt() {
      if (i >= COMPANY_URLS.length) {
        showError("company.json の読み込みに失敗しました。");
        return;
      }
      fetchJson(COMPANY_URLS[i++])
        .then(function (data) {
          applyData(data);
          document.getElementById("error").className = "banner";
          document.getElementById("live").innerHTML = '<span class="pulse"></span>最終更新 ' +
            new Date().toLocaleTimeString("ja-JP");
          document.getElementById("toolbar").hidden = false;
          render();
        })
        .catch(function () { attempt(); });
    }
    attempt();
  }

  setupToolbar();
  load();
})();
</script>
</body>
</html>
